name: Bundle js

on:
  workflow_dispatch:
  push:
    branches: ["master"]

# The deploy step pushes the built site to the gh-pages branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Builds the branch that triggered the workflow: master on push,
      # or the branch chosen when running it manually
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
